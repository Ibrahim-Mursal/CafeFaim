<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Café Faim — Beheer</title>

<!-- This page is not "secured" by hiding the URL — it's secured by the
     GitHub login Decap CMS requires below (see admin/config.yml's
     auth_type: pkce). Anyone can load this page; only someone who signs
     in with write access to the ibrahim-mursal/CafeFaim repo can actually
     save anything.
     A CSP here is looser than index.html's because Decap's bundle needs
     to reach GitHub's API/auth/media endpoints, AND needs 'unsafe-eval' —
     its JSON-schema validator (ajv) compiles validation functions via
     `new Function(...)` internally. That's inherent to the bundle, not
     something a stricter CSP can route around. connect-src includes
     localhost:8081 for `npx decap-server`, the local-editing proxy used
     during development — harmless in production since nothing listens
     there once this is actually deployed.
     blob: is in connect-src alongside img-src because Decap's editor
     preview pane fetches its own generated image-preview blob: URLs, not
     just <img src>-loads them.
     Re-check this list against the browser console after your first real
     GitHub login — Decap's exact set of endpoints can shift between
     releases. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.githubusercontent.com; connect-src 'self' blob: https://api.github.com https://github.com https://*.githubusercontent.com http://localhost:8081; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
</head>
<body>
<!-- Decap CMS reads config.yml next to this file automatically. -->
<script src="https://unpkg.com/decap-cms@^3.1.3/dist/decap-cms.js"></script>
</body>
</html>
